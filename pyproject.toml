[project]
name = "termanat"
version = "0.2.0"
description = "Discover and learn anatomy inside your terminal"
readme = "README.md"
authors = [
    { name = "Etienne Bonnafoux" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["anatomy", "tui", "terminal", "education", "ascii-art"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/etiennebonnafoux/termanat"

[project.scripts]
termanat = "termanat:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
